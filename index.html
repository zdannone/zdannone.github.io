<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>magzi.z</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #474444;
      --text: #FFF5C3;
      --muted: #8a8a8a;
      --line: #2a2a2a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 5vw;
      border-bottom: 1px solid var(--line);
    }
    .logo { font-family: 'Instrument Serif', serif; font-size: 26px; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 24px;
      font-size: 14px;
    }
    nav a:hover { color: var(--text); }

    /* Hero */
    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 5vw;
    }
    .hero h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: clamp(48px, 10vw, 120px);
      line-height: 1.05;
    }
    .hero p { color: var(--muted); max-width: 480px; margin-top: 24px; }

    /* Section umum */
    section { padding: 80px 5vw; border-top: 1px solid var(--line); }
    section h2 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: 36px;
      margin-bottom: 32px;
    }

    /* Grid karya */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }
    .thumb {
      aspect-ratio: 3 / 4;
  background: #222;
  border-radius: 6px;
  width: 100%;
  object-fit: cover;
  display: block;
    }
    .card h3 { font-weight: 500; margin-top: 12px; }
    .card span { color: var(--muted); font-size: 14px; }

    /* Footer */
    footer {
      padding: 40px 5vw;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }
    footer a { color: var(--text); }
  </style>
</head>
<body>

  <header>
    <div class="logo">MAGZI.z</div>
    <nav>
      <a href="#karya">Projects</a>
      <a href="#tentang">About</a>
      <a href="#kontak">Contact</a>
    </nav>
  </header>

  <div class="hero">
    <h1>PORTOFOLIO</h1>
    <p>A clean page, a first line, a final touch.</p>
  </div>

  <section id="Projects">
    <h2>Projects</h2>
    <div class="grid">
     <div class="card"><img class="thumb" src="images/proyek-1.jpg" alt="Deskripsi proyek 1"><h3>FI</h3><span>2026</span></div>
      <div class="card"><img class="thumb" src="images/proyek-2.jpg" alt="Deskripsi proyek 2"><h3>RO</h3><span>2026</span></div>
      <div class="card"><img class="thumb" src="images/proyek-3.jpg" alt="Deskripsi proyek 3"><h3>NA</h3><span>2026</span></div>
    </div>
  </section>

  <section id="About">
    <h2>About</h2>
    <p style="max-width:560px; color:var(--muted);">
      .
    </p>
  </section>

  <section id="Contact">
    <h2>Contact</h2>
    <p>Email: <a href="mailto:zdannone@gmail.com" style="color:var(--text);">zdannone@gmail.com</a></p>
  </section>

  <footer>&copy; 2026 MAGZI.z</footer>

</body>
</html>
